# config/pipeline_pole_external_qwen.yaml — 10.7: run the WHOLE pipeline against the EXTERNAL
# POLE benchmark (data/benchmark-pole-external.json, 9.2/10.1) with the FINE-TUNED Qwen2.5-32B
# (10.6), completing the model x dataset matrix: mistral-7B(SFT) | claude-sonnet(instruct) |
# qwen-32B(SFT) on a graph the student did not author.
#
# Standalone copy of the pipeline config shape (7.3/9.3 convention — never mutate the shared
# config/pipeline.yaml). Differs from 10.4's config/pipeline_pole_external_mistral.yaml ONLY in
# the model column and the results tag:
#   active_model: qwen2.5-32b      (loads checkpoints/qwen2.5-32b/{sl,qg}_adapter_pole_external
#                                   via adapter_suffix_for_version("pole_external"))
#   results_tag:  pole_external_qwen
#
# Run: sbatch kaya/110_run_evaluation_pole_external_qwen.slurm  (GPU + background external Neo4j)

neo4j:
  uri: "bolt://localhost:7687"       # the 10.1 external-POLE graph, on this GPU job's node
  user: "neo4j"
  # password via env var NEO4J_PASSWORD (do not commit real credentials) — the Kaya runner
  # exports NEO4J_PASSWORD before invoking run_evaluation.
  database: "neo4j"

dataset_version: pole_external
results_tag: pole_external_qwen           # -> results/{tables,metrics,qual_records}_qwen2.5-32b_pole_external_qwen.*
                                          # (distinct from 9.3's *_claude-sonnet_pole_external_local.*
                                          #  and 10.4's *_mistral7b_pole_external_mistral.*)

models_registry: "config/models.yaml"
active_model: "qwen2.5-32b"               # LOCAL — base Qwen/Qwen2.5-32B (4-bit/fp16, locked by the
                                          # 10.5 fit-test) + the 10.6 `_pole_external` adapters.

ad: null                                  # null -> base Qwen as the AD (the documented default; matches
dis: null                                 # null -> shares the AD backend          10.4's mistral run)

benchmark: "data/benchmark-pole-external.json"
schema_linker_inference: "config/schema_linker_inference.yaml"   # reads decoding[qwen2.5-32b]
                                          # (added by 10.7; beam, k=5). The G2a sweep CLI accepts only
                                          # --dataset_version v2|v3, so — exactly as in 10.4 — this
                                          # substrate REUSES the penalty as a documented pragmatic
                                          # default rather than re-sweeping it. 10.6's 25-item sample
                                          # Cov@5=0.760 at dp=1.0 on this adapter/schema confirms it is
                                          # not decoding-limited. A dedicated re-sweep is future work.
use_embedding_model: true

# QG properties block: REQUIRED on the local "completion" path — see the identical note in
# config/pipeline_pole_external_mistral.yaml. decisions-log 2026-08-22: omitting this key is the
# defect that superseded 10.4's first G4 run (job 1101275); 4 of this schema's 27 properties —
# incl. `nhs_no` — appear ZERO times in data/pole_ext_qg_train_mixed.jsonl, so the prompt is their
# only possible source. Both Qwen substrates set it, so the Qwen column is properties-ON like the
# canonical Mistral and Claude columns (single-factor comparability).
qg_include_properties: true
results_dir: "results/"
