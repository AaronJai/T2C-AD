[project]
name = "t2c-ad"
version = "0.1.0"
description = "Multi-agent Text-to-Cypher pipeline with explicit ambiguity detection and disambiguation."
requires-python = ">=3.11"
dependencies = [
    # 0.2 — LLM interface & backends
    "torch",
    "transformers",
    "openai",
    "anthropic",
    "peft",            # lazily imported by HuggingFaceLLM only when a LoRA adapter is given
    # 1.2 — Schema Linker training data
    "datasets",        # loads neo4j/text2cypher-2025v1 (auto-download + cache)
    "neo4j",           # CyVer SyntaxValidator driver (lazy; only when a live DB is configured)
    "CyVer",           # SyntaxValidator pass on extracted patterns (lazy; needs live Neo4j)
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pipeline*"]

[tool.pytest.ini_options]
markers = [
    "integration: requires live Neo4j, a GPU, or a trained adapter (skipped by default)",
]
