# config/schema_linker_train_qwen_pole_external.yaml — Stage 2 of 10.6 on the OTHER substrate:
# continue-SFT the Qwen generic SL adapter (Stage 1) on the real external-POLE in-domain data
# (10.2), writing checkpoints/qwen2.5-32b/sl_adapter_pole_external — the path
# `_resolve_model_specs` builds for `active_model: qwen2.5-32b` at
# `dataset_version: pole_external`. Identical to schema_linker_train_qwen_v3.yaml (see its
# header) except for the data paths and output_name; both continues branch from the SAME
# generic adapter, so neither touches the other.
#
# python -m experiments.train_schema_linker --model_key qwen2.5-32b \
#     --train config/schema_linker_train_qwen_pole_external.yaml

model:
  init_adapter_path_name: "sl_adapter"   # checkpoints/qwen2.5-32b/sl_adapter — Stage-1 generic

peft:
  method: "lora"
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"
  # target_modules: unused when init_adapter_path_name is set.

training:
  output_name: "sl_adapter_pole_external"  # -> checkpoints/qwen2.5-32b/sl_adapter_pole_external
  num_train_epochs: 2
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 32
  gradient_checkpointing: true
  learning_rate: 1.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03
  max_seq_length: 3584
  weight_decay: 0.001
  bf16: false
  fp16: true
  logging_steps: 20
  save_strategy: "epoch"
  evaluation_strategy: "epoch"

data:
  train_path: "data/pole_ext_sl_train.jsonl"   # external-POLE only (10.2), NOT the _mixed file
  eval_path:  "data/pole_ext_sl_eval.jsonl"
  format: "prompt_completion"
