# config/query_generator_train_qwen_generic.yaml — Stage 1 of 10.6 for the Query Generator:
# FROM-SCRATCH LoRA on a 4,000-row seed=13 sample of the Ozsoy QG split, producing the generic
# checkpoints/qwen2.5-32b/qg_adapter. Identical in shape to
# schema_linker_train_qwen_generic.yaml (see its header for why every Qwen override is needed);
# differs only in `data` paths and `output_name`.
#
# python -m experiments.train_query_generator --model_key qwen2.5-32b \
#     --train config/query_generator_train_qwen_generic.yaml

# model: no init_adapter_path_name — fresh LoraConfig (target_modules from config/models.yaml).

peft:
  method: "lora"
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"
  # target_modules: comes from config/models.yaml (qwen2.5-32b -> ["q_proj","v_proj"])

training:
  output_name: "qg_adapter"              # -> checkpoints/qwen2.5-32b/qg_adapter (generic)
  num_train_epochs: 3
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 32
  gradient_checkpointing: true           # REQUIRED for Qwen2.5-32B on v100-32gb (10.5)
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03
  max_seq_length: 3584
  weight_decay: 0.001
  bf16: false
  fp16: true
  logging_steps: 50
  save_strategy: "epoch"
  evaluation_strategy: "epoch"

data:
  train_path: "data/ozsoy_qg_train_4k.jsonl"   # seed=13 sample of ozsoy_qg_train.jsonl (32,339 rows)
  eval_path:  "data/ozsoy_qg_eval.jsonl"       # full Ozsoy eval split (unchanged, 2.4)
  format: "prompt_completion"
