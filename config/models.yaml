# config/models.yaml — the set of trainable base models (extend freely).
#
# One entry per base, keyed by a short `model_key`. Adding a new base later is a single
# new entry here — no code or spec change. These are the PER-MODEL / PER-ARCHITECTURE
# fields; shared hyperparameters live in config/schema_linker_train.yaml (and the QG
# equivalent in 2.4). Adapters are namespaced checkpoints/{model_key}/sl_adapter so
# multiple bases coexist without overwriting each other.
#
# `target_modules` is architecture-specific and therefore lives here, not in the shared
# YAML: ["q_proj","v_proj"] covers the Mistral/Llama family; Gemma/Qwen/Phi differ.
# `load_in_4bit: true` (QLoRA) is the default because a 7-8B base won't fit in bf16 on a
# 16 GB card (e.g. the RTX 5080); set it false only on a larger GPU. Record any per-model
# choice in decisions-log.md.

mistral7b:
  base: "mistralai/Mistral-7B-v0.3"
  target_modules: ["q_proj", "v_proj"]      # Mistral/Llama attention proj names
  dtype: "float16"                           # Kaya branch: V100 (Volta) has no bf16 — fp16 here
                                             # (also sets bnb_4bit_compute_dtype). See decisions-log.
  load_in_4bit: true                         # QLoRA — required to fit a 7-8B base on a 16 GB GPU

qwen2.5-32b:
  base: "Qwen/Qwen2.5-32B"                   # BASE, not -Instruct: parity with mistral7b (v0.3 base) so
                                             # C1 is an honest zero-shot base baseline and C2/C3 isolate
                                             # the SFT effect. (-Instruct is the alternative if a strong
                                             # C1 is wanted — record the choice.) Qwen2ForCausalLM, loads
                                             # natively on the pinned transformers<4.46. See 10.5.
  target_modules: ["q_proj", "v_proj"]       # Qwen2 attention proj names; mirrors mistral7b's set
                                             # (["q_proj","k_proj","v_proj","o_proj"] is the alternative)
  dtype: "float16"                           # Kaya v100-32gb (Volta) has no bf16 — fp16 here
                                             # (also the bnb_4bit_compute_dtype). See decisions-log.
  load_in_4bit: true                         # LOCKED by the 10.5 fit-test (job 1101258): 4-bit load
                                             # = 20.2 GiB (fits 1 card for inference); 8-bit = 32.9 GiB
                                             # (needs 2). Training needs batch 1 + gradient
                                             # checkpointing across 2 cards. See decisions-log 2026-08-22.

qwen2.5-72b:
  base: "Qwen/Qwen2.5-72B"                   # BASE, not -Instruct: the same parity argument as
                                             # qwen2.5-32b above — C1 stays an honest zero-shot
                                             # base baseline and C2/C3 isolate the SFT effect.
                                             # Qwen2ForCausalLM, 80 layers / hidden 8192 / GQA 64:8,
                                             # vocab 152064 (identical to the 32B), config
                                             # transformers_version 4.43.1 < the pinned <4.46.
                                             # 37 shards / 135.4 GiB cached in $HF_HOME (11.1).
  target_modules: ["q_proj", "v_proj"]       # identical to qwen2.5-32b (Qwen2 attention names) —
                                             # held constant so model size is the only variable
  dtype: "float16"                           # sm90 HAS bf16; fp16 kept deliberately for
                                             # cross-model parity with the 7B/32B recipe (11.1)
  load_in_4bit: true                         # inherited from 10.5's lock, NOT re-decided (11.2's
                                             # parity clause) — 11.2 MEASURES, it does not choose.
                                             # Measured on ONE H100 NVL (93.1 GiB), job 1144935:
                                             # 4-bit load 42.5 GiB; QLoRA step at batch 1 + grad
                                             # checkpointing, seq 3584 = peak 66.2 GiB @ 6.51
                                             # s/micro-step. One card per training job.

llama31-8b:
  base: "meta-llama/Llama-3.1-8B"
  target_modules: ["q_proj", "v_proj"]       # Llama-family: same names as Mistral
  dtype: "bfloat16"
  load_in_4bit: true

# Example future model (different family -> different target_modules):
# gemma2-9b:
#   base: "google/gemma-2-9b"
#   target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]
#   dtype: "bfloat16"
#   load_in_4bit: true

# ── API models (kind: api) ──────────────────────────────────────────────────────────
# One model runs the WHOLE pipeline (SL + QG + AD + Dis), not API-for-one/local-for-the-rest.
# An API model isn't fine-tuned and has no adapters; the SL gets its candidate distribution by
# TEMPERATURE SAMPLING instead of diverse beam search (the sampling temperature is locked per
# model by the 2.2 sweep into config/schema_linker_inference.yaml, the analogue of the local
# diversity_penalty). C2/C3 are reframed as stage-presence (the schema-grounding/disambiguation
# STAGES) rather than fine-tuning — see decisions-log and feature-specs/phase5/5.5. Set
# `active_model` to one of these in config/pipeline.yaml and export the backend's API key
# (ANTHROPIC_API_KEY / OPENAI_API_KEY). No GPU needed; live Neo4j still is.
claude-sonnet:
  kind: api
  backend: anthropic
  model: "claude-sonnet-4-6"

gpt-4o:
  kind: api
  backend: openai
  model: "gpt-4o"
