# config/query_generator_train_qwen72_generic.yaml — Stage 1 of 11.3 for the Query Generator:
# FROM-SCRATCH LoRA on the SAME 4,000-row seed=13 sample of the Ozsoy QG split 10.6 used,
# producing the generic checkpoints/qwen2.5-72b/qg_adapter. Identical in shape to
# schema_linker_train_qwen72_generic.yaml (see its header for why every setting is held constant);
# differs only in `data` paths and `output_name`.
#
# THIS FILE IS THE 10.6 RECIPE, UNCHANGED — a copy of
# config/query_generator_train_qwen_generic.yaml whose parsed content is byte-identical; only this
# header comment differs. Parity is asserted mechanically by
# tests/test_train_config_parity_qwen72.py (11.3 acceptance 1).
#
# Measured cost (11.2, 6.51 s/micro-step): 12,000 micro-steps ~= 21.7 h + ~3 h eval.
#
# python -m experiments.train_query_generator --model_key qwen2.5-72b \
#     --train config/query_generator_train_qwen72_generic.yaml
#   (or, via the 11.1 runner: MODEL_KEY=qwen2.5-72b bash kaya/102_train_qwen_qg.slurm)

# model: no init_adapter_path_name — fresh LoraConfig (target_modules from config/models.yaml).

peft:
  method: "lora"
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"
  # target_modules: comes from config/models.yaml (qwen2.5-72b -> ["q_proj","v_proj"])

training:
  output_name: "qg_adapter"              # -> checkpoints/qwen2.5-72b/qg_adapter (generic)
  num_train_epochs: 3
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 32
  gradient_checkpointing: true           # parity with 10.6 (66.2 GiB peak with it — 11.2)
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03
  max_seq_length: 3584
  weight_decay: 0.001
  bf16: false
  fp16: true
  logging_steps: 50
  save_strategy: "epoch"
  evaluation_strategy: "epoch"

data:
  train_path: "data/ozsoy_qg_train_4k.jsonl"   # the SAME seed=13 sample 10.6 used — do not regenerate
  eval_path:  "data/ozsoy_qg_eval.jsonl"       # full Ozsoy eval split (unchanged since 2.4)
  format: "prompt_completion"
